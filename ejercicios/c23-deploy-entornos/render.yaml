services:
  - type: web
    name: libreria-ai-c23-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    rootDir: ejercicios/c23-deploy-entornos/backend
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: libreria-ai-c23-web
    runtime: static
    branch: main
    rootDir: ejercicios/c23-deploy-entornos/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
