<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Document</title>
</head>
<body>
    
<nav class="navbar navbar-expand-lg navbarCustom">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            <i class="bi bi-book"></i> Librería
        </a>

        <ul class="navbar-nav d-flex flex-row gap-3">

            <li class="nav-item">
                <a class="nav-link active" href="index.html">Inicio</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="catalogo.html">Catalogo</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
            </li>

        </ul>

    </div>

</nav>


<main class="container mt-5 mb-5">

    <div class="busquedaContainer">

        <h1 class="text-center mb-4 catalogoTitulo">
            Contacto
        </h1>

        <form>

            <div class="mb-3">

                <label for="nombre" class="form-label">
                    Nombre
                </label>

                <input type="text" id="nombre" class="form-control" required>

            </div>

            <div class="mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input type="email" id="email" class="form-control" required>

            </div>

            <div class="mb-3">

                <label for="asunto" class="form-label">
                    Asunto
                </label>

                <select id="asunto" class="form-select" required>

                    <option value="">
                        Seleccione una opción
                    </option>

                    <option value="consulta">
                        Consulta
                    </option>

                    <option value="reclamo">
                        Reclamo
                    </option>

                    <option value="sugerencia">
                        Sugerencia
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label for="mensaje" class="form-label">
                    Mensaje
                </label>

                <textarea id="mensaje" class="form-control" rows="5" required></textarea>

            </div>

            <button type="submit" class="btn botonHero">
                Enviar
            </button>

        </form>

    </div>

</main>

<footer class="footerCustom">

    <p>
        Librería - 2026
    </p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
